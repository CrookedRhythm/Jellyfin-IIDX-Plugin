name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/IIDX.Core.Tests -c Release

      - name: Package plugin
        run: |
          dotnet publish src/Jellyfin.Plugin.IIDX -c Release -o publish
          mkdir -p artifacts
          cd publish
          zip ../artifacts/jellyfin-plugin-iidx.zip Jellyfin.Plugin.IIDX.dll IIDX.Core.dll
          cd ..
          echo "MD5: $(md5sum artifacts/jellyfin-plugin-iidx.zip | cut -d' ' -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-iidx
          path: artifacts/jellyfin-plugin-iidx.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/jellyfin-plugin-iidx.zip
